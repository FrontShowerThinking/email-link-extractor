<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
		<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Link Extractor" />
    <link rel="manifest" href="favicon/site.webmanifest" />
<title>SFMC Link Extractor</title>
  </head>
  <body>
<header class="header">
  <div class="header-icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>Link Extractor</h1>
    <p>Extrae title, alias y href de cada <code>&lt;a&gt;</code> en el HTML del email</p>
  </div>
  <button id="theme-toggle" class="theme-toggle">🌙 Dark</button>
</header>

<div class="container">

  <!-- Input -->
  <div class="input-block">
    <label for="source">HTML del email</label>
    <textarea id="source" placeholder="Pega aquí el HTML completo del email…"></textarea>
    <button class="btn-extract" onclick="extractLinks()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
      </svg>
      Extraer enlaces
    </button>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="C">C_</button>
      <button class="filter-btn" data-filter="N">N_</button>
      <button class="filter-btn" data-filter="empty">Sin alias</button>
      <button class="filter-btn" id="filter-warning" data-filter="warning" style="display: none;">⚠️ Avisos</button>
    </div>
  </div>

  <!-- Results -->
  <div id="results-wrapper" style="display:none">
    <div class="results-header" style="margin-bottom:10px">
      <span class="results-label">Enlaces encontrados</span>
      <span class="results-count" id="results-count">0</span>
      <button class="btn-export" id="btn-export" onclick="exportCSV()" title="Exporta a CSV los enlaces visibles según el filtro activo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
        </svg>
        Exportar CSV
      </button>
    </div>
    <div id="results"></div>
  </div>

  <div class="empty-state" id="empty-state">
    <div class="icon">🔍</div>
    <strong>No se encontraron enlaces</strong>
    <p>El HTML pegado no contiene etiquetas <code>&lt;a&gt;</code>.</p>
  </div>

</div>
    <script src="script.js"></script>
  </body>
</html>
