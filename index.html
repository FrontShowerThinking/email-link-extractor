<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
		<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Link Extractor" />
    <link rel="manifest" href="favicon/site.webmanifest" />
<title>Link Extractor</title>
  </head>
  <body>
<header class="header">
  <div class="header-icon">
    <img src="extractor-logo.png" alt="Link Extractor logo">
  </div>
  <div class="header-text">
    <h1>Link Extractor</h1>
    <p>Extrae title, alias y href de cada <code>&lt;a&gt;</code> en el HTML del email</p>
  </div>
  <button id="theme-toggle" class="theme-toggle">🌙 Dark</button>
</header>

<div class="container">

  <!-- Input -->
  <div class="input-block">
    <label for="source">HTML del email</label>
    <textarea id="source" placeholder="Pega aquí el HTML completo del email…"></textarea>
    <button class="btn-extract" onclick="extractLinks()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
      </svg>
      Extraer enlaces
    </button>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="C">C_</button>
      <button class="filter-btn" data-filter="N">N_</button>
      <button class="filter-btn" data-filter="empty">Sin alias</button>
      <button class="filter-btn" id="filter-warning" data-filter="warning" style="display: none;">⚠️ Avisos</button>
    </div>
  </div>

  <!-- Asset detectado -->
  <div class="asset-box" id="asset-box" style="display:none">
    <div class="asset-box-header">
      <span class="asset-box-title">
        <span class="asset-box-icon"><img src="link-icon.png" alt=""></span>
        Campaign Asset
      </span>
      <span class="asset-box-badge" id="asset-box-badge"></span>
    </div>
    <div class="asset-box-body" id="asset-box-body"></div>
  </div>

  <!-- Results -->
  <div id="results-wrapper" style="display:none">
    <div class="results-header" style="margin-bottom:10px">
      <span class="results-label">Enlaces encontrados</span>
      <span class="results-count" id="results-count">0</span>
      <div class="results-actions">
        <button class="btn-export" id="btn-copy-csv" onclick="copyCSV(this)" title="Copia el CSV de los enlaces visibles según el filtro activo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
          </svg>
          Copiar CSV
        </button>
        <button class="btn-export" id="btn-export" onclick="exportCSV()" title="Exporta a CSV los enlaces visibles según el filtro activo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
          </svg>
          Exportar CSV
        </button>
      </div>
    </div>
    <div id="results"></div>
  </div>

  <div class="empty-state" id="empty-state">
    <div class="icon">🔍</div>
    <strong>No se encontraron enlaces</strong>
    <p>El HTML pegado no contiene etiquetas <code>&lt;a&gt;</code>.</p>
  </div>

</div>
    <script src="script.js"></script>
  </body>
</html>
